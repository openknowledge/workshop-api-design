services:
  authentication-ui:
    image: nginx:1.27.1
    ports:
      - "6060:8080"
    volumes:
      - ./authentication-ui/nginx.conf.template:/etc/nginx/nginx.conf.template
      - ./authentication-ui/static:/var/www
    environment:
      CODESPACE_NAME: ${CODESPACE_NAME:-}
    command: |
      /bin/bash -c '
      export CODESPACE_HOST=$([ -n "$CODESPACE_NAME" ] && echo "$CODESPACE_NAME-6060.app.github.dev" || echo "localhost:6060");
      envsubst < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf;
      exec nginx -g "daemon off;"
      '

  customer-service:
    build: customer-service/
    ports:
      - "8181:8080"
    environment:
      - BILLING_SERVICE_URL=http://billing-service:8080
      - DELIVERY_SERVICE_URL=http://delivery-service:8080

  billing-service:
    build: billing-service/
    container_name: billing-service
    ports:
      - "8182:8080"

  delivery-service:
    build: delivery-service/
    container_name: delivery-service
    ports:
      - "8183:8080"
    environment:
      - ADDRESS_VALIDATION_SERVICE_URL=http://address-validation-service:8080

  address-validation-service:
    build: address-validation-service/
    container_name: address-validation_service
    ports:
      - "8184:8080"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: keycloak
    command: "start-dev"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin123
    ports:
      - "9191:8080"
    volumes:
      - ./keycloak/:/opt/keycloak/data/h2/
